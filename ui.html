<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<title>YouTube 逐字稿 → AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=Archivo+Black&family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="逐字稿">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/tokens.css">
<style>
/* 依使用者要求：所有區塊等寬、置中，不使用不等分分鏡格 */
body{padding:0 var(--space-4) var(--space-8)}
.page{
  max-width:860px; margin-inline:auto;
  display:grid; gap:var(--space-2);
  padding-top:var(--space-6);
}

/* ---- 頁首：置中，全頁唯一大黑塊 ---- */
.hd{text-align:center; padding-block:var(--space-6)}
.hd__mark{
  width:56px; height:56px; margin:0 auto var(--space-4);
  display:grid; place-items:center;
  background:var(--color-surface-ink); color:var(--color-text-invert);
  border:var(--border-width) solid var(--color-text-invert);
}
.hd__mark svg{width:28px; height:28px}
.hd__title{display:block}
.hd__sub{display:block; margin-top:var(--space-2)}

/* ---- 輸入區：置中對齊 ---- */
.inrow{display:flex; gap:var(--space-2); align-items:stretch}
.inrow .fi-input{flex:1 1 auto; text-align:center}
.inrow .fi-btn{flex:none; white-space:nowrap}
.lead{text-align:center; margin-bottom:var(--space-3)}

/* ---- 選項 ---- */
details.opts{margin-top:var(--space-5); border-top:var(--border); padding-top:var(--space-4)}
details.opts summary{
  font:700 13px/1.2 var(--font-sans);
  letter-spacing:.08em; text-transform:uppercase;
  cursor:pointer; list-style:none;
  display:flex; align-items:center; justify-content:center; gap:var(--space-2);
  user-select:none;
}
details.opts summary::-webkit-details-marker{display:none}
details.opts summary::before{content:"▸"; font-family:var(--font-mono);
  transition:transform var(--dur-fast) var(--ease)}
details.opts[open] summary::before{transform:rotate(90deg)}
.optbody{display:grid; gap:var(--space-5); margin-top:var(--space-5)}
.opthint{margin-top:var(--space-2)}

/* ---- 結果 ---- */
.badges{display:flex; gap:var(--space-2); flex-wrap:wrap; margin-top:var(--space-3)}
.actions{display:flex; gap:var(--space-2); flex-wrap:wrap}
.plist{display:flex; gap:var(--space-2); flex-wrap:wrap; margin-top:var(--space-4)}
.plist .fi-btn{flex-direction:column; gap:2px; text-transform:none; letter-spacing:.02em}
.plist .fi-btn small{font:400 11px/1.3 var(--font-mono); text-transform:none; letter-spacing:0}

@media (max-width:640px){
  .inrow{flex-direction:column}
  .inrow .fi-btn{width:100%}
  .inrow .fi-input{text-align:left}
}

</style>
</head>
<body>

<div class="page">

  <!-- 頁首 -->
  <header class="fi-panel fi-panel--ink hd">
    <span class="hd__mark">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M3 4h18v2.6H3zm0 5.2h18v2.6H3zm0 5.2h12v2.6H3zm0 5.2h12v2.6H3z"/>
      </svg>
    </span>
    <span class="fi-h2 hd__title">YouTube 逐字稿 → AI</span>
    <span class="fi-small hd__sub">貼上影片連結，取得為 AI 分析最佳化的逐字稿</span>
  </header>

  <!-- 輸入 -->
  <section class="fi-panel">
    <p class="fi-label lead">影片連結</p>
    <div class="inrow">
      <input id="url" class="fi-input" type="url" inputmode="url" autocomplete="off"
             spellcheck="false" placeholder="YouTube、Bilibili、Vimeo、X、TikTok…">
      <button id="go" class="fi-btn fi-btn--primary">開始轉錄</button>
    </div>

    <details class="opts">
      <summary>選項</summary>
      <div class="optbody">
        <div>
          <span class="fi-label" style="display:block;margin-bottom:var(--space-2)">
            AI 聽寫速度（只有影片沒字幕時才用到）
          </span>
          <div class="fi-seg" id="segSpeed">
            <button class="fi-seg__btn" data-v="fast">快速</button>
            <button class="fi-seg__btn is-on" data-v="accurate">準確</button>
          </div>
          <p class="fi-small fi-muted opthint" id="speedHint"></p>
        </div>
        <div>
          <span class="fi-label" style="display:block;margin-bottom:var(--space-2)">分析模式</span>
          <div class="fi-seg" id="segPrompt">
            <button class="fi-seg__btn is-on" data-v="deep">深度學習</button>
            <button class="fi-seg__btn" data-v="quick">快速摘要</button>
            <button class="fi-seg__btn" data-v="none">純逐字稿</button>
          </div>
          <p class="fi-small fi-muted opthint" id="promptHint"></p>
        </div>
      </div>
    </details>
  </section>

  <div class="fi-status" id="status" hidden>
    <span class="fi-spinner"></span>
    <span id="statusText">處理中…</span>
  </div>

  <div class="fi-panel" id="err" hidden
       style="background:var(--tint-danger); white-space:pre-wrap"></div>

  <!-- 結果：全部等寬 -->
  <div id="result" hidden style="display:grid; gap:var(--space-2)">

    <section class="fi-panel">
      <h2 class="fi-h3" id="vTitle"></h2>
      <p class="fi-small fi-muted" id="vMeta" style="margin-top:var(--space-2)"></p>
      <div class="badges" id="vBadges"></div>
    </section>

    <section class="fi-panel">
      <div class="actions">
        <button class="fi-btn fi-btn--primary" id="btnCopy">複製全部給 AI</button>
        <button class="fi-btn" id="btnMd">下載 .md</button>
        <button class="fi-btn" id="btnTxt">下載 .txt</button>
        <button class="fi-btn" id="btnSrt">下載 .srt</button>
        <button class="fi-btn fi-btn--ghost" id="btnOpen">開啟影片</button>
      </div>
    </section>

    <section class="fi-panel fi-panel--tint-warm" id="partsBox" hidden>
      <h3 class="fi-h4" id="partsTitle"></h3>
      <p class="fi-small" id="partsDesc" style="margin-top:var(--space-2)"></p>
      <div class="plist" id="partsList"></div>
    </section>

    <section>
      <div class="fi-tabs">
        <button class="fi-tabs__btn is-on" data-t="markdown">Markdown</button>
        <button class="fi-tabs__btn" data-t="plaintext">純文字</button>
      </div>
      <pre class="fi-out" id="out"></pre>
    </section>

    <section class="fi-panel fi-panel--tint-warm">
      <p class="fi-small">
        <strong>怎麼用：</strong>按「複製全部給 AI」，然後貼到 Claude、ChatGPT 或 Gemini 的對話框，
        直接送出即可。內容已附上分析指示，AI 會自動整理出重點、論證脈絡與精華段落的時間戳。
      </p>
    </section>

  </div>

</div>

<script>
const $ = s => document.querySelector(s);
let data = null, tab = 'markdown', timer = null;

// 分段選擇器
document.querySelectorAll('.fi-seg').forEach(seg => {
  seg.addEventListener('click', e => {
    const b = e.target.closest('.fi-seg__btn'); if (!b) return;
    seg.querySelectorAll('.fi-seg__btn').forEach(x => x.classList.remove('is-on'));
    b.classList.add('is-on');
  });
});
const segVal = id => $(id).querySelector('.fi-seg__btn.is-on').dataset.v;

// 分頁
document.querySelectorAll('.fi-tabs__btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.fi-tabs__btn').forEach(x => x.classList.remove('is-on'));
    b.classList.add('is-on'); tab = b.dataset.t; render();
  });
});

function setStatus(msg, on = true) {
  $('#status').hidden = !on;
  if (msg) $('#statusText').textContent = msg;
}
function setErr(msg) {
  $('#err').hidden = !msg;
  $('#err').textContent = msg || '';
}

const PROMPT_HINTS = {
  deep:  '完整的三階段分析：先忠實還原影片結構（不混入 AI 觀點），再由 AI 解讀作者的「思考方式」，最後給你可遷移的應用、自我檢測題與一個具體行動。知識思考型影片建議用這個。',
  quick: '精簡版：一句話總結 + 五個重點 + 值得回看的片段 + 一個行動。想快速判斷影片值不值得深入時用。',
  none:  '只給逐字稿本身，不附任何指示。你想自己下提示詞時用。',
};
const SPEED_HINTS = {
  fast:     '18 分鐘影片約 1 分鐘跑完。準確度低約 5%（每 18 個詞差 1 個）。' +
            '除了準確度之外全面更省：耗電少 5 倍、硬碟少 12 倍、記憶體少 25%，' +
            '網路流量則完全相同。趕時間、用電池、或只想先抓重點時選這個。',
  accurate: '18 分鐘影片約 4.5 分鐘跑完，耗電是「快速」的 5.2 倍。' +
            '準確度最高，值得用在你要仔細研讀的內容。手機會自動改用快速模式。',
};
function syncHint() {
  $('#promptHint').textContent = PROMPT_HINTS[segVal('#segPrompt')];
  $('#speedHint').textContent = SPEED_HINTS[segVal('#segSpeed')];
}
['#segPrompt', '#segSpeed'].forEach(id =>
  $(id).addEventListener('click', e => { if (e.target.closest('.fi-seg__btn')) syncHint(); }));
syncHint();

function options() {
  // 其餘參數經實測對輸出幾乎沒有影響，固定成最佳值，不再讓使用者選：
  // 時間戳段落級、段落 45 秒、清理贅詞、附影片資訊
  return {
    prompt_mode:   segVal('#segPrompt'),
    allow_whisper: true,
    // 快速=tiny；準確=交給後端自動判斷（電腦 small、手機 tiny）
    whisper_model: segVal('#segSpeed') === 'fast' ? 'tiny' : null,
    timestamps: 'para', target_sec: 45,
    include_meta: true, clean: true,
  };
}

async function start() {
  const url = $('#url').value.trim();
  if (!url) { $('#url').focus(); return; }

  $('#go').disabled = true; $('#go').textContent = '處理中…';
  $('#result').hidden = true;
  setErr(''); setStatus('正在連線…');

  try {
    const r = await fetch('/api/start', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, options: options() })
    });
    const j = await r.json();
    if (!r.ok || j.error) throw new Error(j.error || '無法啟動');
    poll(j.id);
  } catch (e) { fail(e.message); }
}

function poll(id) {
  clearInterval(timer);
  timer = setInterval(async () => {
    try {
      const r = await fetch('/api/status?id=' + id);
      const j = await r.json();
      if (j.log && j.log.length) setStatus(j.log[j.log.length - 1]);
      if (j.status === 'done')  { clearInterval(timer); done(j.result); }
      if (j.status === 'error') { clearInterval(timer); fail(j.error); }
    } catch (e) { clearInterval(timer); fail('與程式的連線中斷，請確認程式還在執行'); }
    // 1.5 秒。原本是 600ms，等於轉錄期間每分鐘 100 次請求；
    // 手機上這種頻率會一直喚醒網路與 CPU，而進度文字每秒更新一次就夠讀了。
  }, 1500);
}

function fail(msg) {
  setStatus('', false); setErr(msg);
  $('#go').disabled = false; $('#go').textContent = '開始轉錄';
}

function done(res) {
  data = res;
  setStatus('', false);
  $('#go').disabled = false; $('#go').textContent = '開始轉錄';

  const m = res.meta, s = res.stats, sm = res.sub_meta;
  $('#vTitle').textContent = m.title || '（無法取得標題）';

  const bits = [];
  if (m.channel) bits.push(m.channel);
  if (m.upload_date) bits.push(m.upload_date);
  $('#vMeta').textContent = bits.join('　·　');

  // 狀態一律「實色圓點 + 黑字白底」
  const badges = [];
  if (m.duration) badges.push(['', fmtDur(m.duration)]);
  badges.push(['info', '約 ' + s.tokens.toLocaleString() + ' tokens']);
  badges.push(['', s.paragraphs + ' 個段落']);
  if (s.chapters) badges.push(['success', s.chapters + ' 個章節']);
  if (s.audio_mb) badges.push(['warning', '用掉 ' + s.audio_mb + ' MB 流量']);
  badges.push(sm.whisper ? ['warning', sm.engine || 'AI 聽寫']
            : sm.generated ? ['warning', '自動字幕 · ' + sm.lang]
                           : ['success', '人工字幕 · ' + sm.lang]);
  $('#vBadges').innerHTML = badges.map(([c, t]) =>
    `<span class="fi-tag${c ? ' fi-tag--' + c : ''}">` +
    `<span class="fi-tag__dot"></span>${esc(t)}</span>`).join('');

  renderParts(res.parts || []);

  $('#result').hidden = false;
  render();
  $('#result').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function render() { $('#out').textContent = data ? data[tab] : ''; }

function renderParts(parts) {
  const box = $('#partsBox');
  if (!parts.length) { box.hidden = true; return; }
  box.hidden = false;
  $('#partsTitle').textContent = `這部影片較長，已自動切成 ${parts.length} 份`;
  $('#partsDesc').textContent =
    '整份太長會讓 AI 的分析品質明顯下降。每一份都已附上完整的分析指示與影片資訊，' +
    '可以單獨貼給 AI。點一下即複製該份，分次貼給 AI 分析效果最好。';
  $('#partsList').innerHTML = parts.map((p, i) =>
    `<button class="fi-btn fi-btn--sm" data-i="${i}">第 ${p.index} 份` +
    `<small>${esc(p.range)}．約 ${p.tokens.toLocaleString()} tokens</small></button>`
  ).join('');
  $('#partsList').querySelectorAll('.fi-btn').forEach(b => {
    b.addEventListener('click', async () => {
      const p = parts[+b.dataset.i];
      try { await navigator.clipboard.writeText(p.markdown); }
      catch { const ta=document.createElement('textarea'); ta.value=p.markdown;
              ta.style.position='fixed'; ta.style.opacity='0';
              document.body.appendChild(ta); ta.select();
              document.execCommand('copy'); ta.remove(); }
      const old = b.innerHTML;
      b.classList.add('fi-btn--primary');
      b.innerHTML = `已複製 ✓<small>貼給 AI 即可</small>`;
      setTimeout(() => { b.classList.remove('fi-btn--primary'); b.innerHTML = old; }, 2000);
    });
  });
}

const esc = t => String(t).replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function fmtDur(sec) {
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  return h ? `${h} 小時 ${m} 分` : `${m} 分 ${sec % 60} 秒`;
}

function safeName(ext) {
  const t = (data?.meta?.title || 'transcript').replace(/[\\/:*?"<>|]/g, '_').slice(0, 60);
  return t + ext;
}
function download(text, ext) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = safeName(ext);
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

$('#btnCopy').addEventListener('click', async () => {
  if (!data) return;
  const text = data[tab];
  const btn = $('#btnCopy'), old = btn.textContent;
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  btn.textContent = '已複製 ✓';
  setTimeout(() => { btn.textContent = old; }, 1800);
});

$('#btnMd').addEventListener('click',  () => data && download(data.markdown, '.md'));
$('#btnTxt').addEventListener('click', () => data && download(data.plaintext, '.txt'));
$('#btnSrt').addEventListener('click', () => data && download(data.srt, '.srt'));
$('#btnOpen').addEventListener('click', () => data && window.open(data.meta.url, '_blank'));

$('#go').addEventListener('click', start);
$('#url').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });

// 心跳：讓程式知道還有人在用。關掉分頁幾分鐘後伺服器會自動結束，
// 這樣就不會每按一次桌面捷徑就多留一個永遠不關的背景程序。
const ping = () => fetch('/api/ping').catch(() => {});
ping();
setInterval(ping, 30000);   // 伺服器閒置 5 分鐘才結束，30 秒一次綽綽有餘

window.addEventListener('load', () => { if (window.innerWidth > 640) $('#url').focus(); });
</script>
</body>
</html>
